plugins { id 'com.android.application' }
android {
 namespace 'app.meydan'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'app.meydan.challenge'; minSdk 29; targetSdk 35; versionCode 1; versionName '0.1.0' }
 sourceSets { main { assets.srcDirs = ['../../shared'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'org.java-websocket:Java-WebSocket:1.5.7'; implementation 'org.slf4j:slf4j-nop:2.0.16' }
