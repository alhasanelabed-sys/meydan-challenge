name: Build and release Meydan
on:
  push:
    branches: [main]
    paths-ignore: ['docs/progress.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/meydan-android.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows/Meydan.csproj -r win-x64 --self-contained true -c Release -p:PublishTrimmed=true -p:TrimMode=partial -o artifacts/windows
      - run: python scripts/verify_windows_bluetooth.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/meydan-windows-portable.zip
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix relay
      - run: dotnet build windows/Meydan.csproj -c Debug
      - run: dotnet run --project tests/NativeChecks/NativeChecks.csproj
      - run: npm test
        env:
          MEYDAN_DOTNET: dotnet
      - run: mkdir -p artifacts/java-tests && javac -d artifacts/java-tests android/app/src/main/java/app/meydan/FrameReader.java tests/FrameReaderTest.java && java -cp artifacts/java-tests app.meydan.FrameReaderTest
  release:
    needs: [android, windows, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cp shared/questions.json artifacts/meydan-demo-questions.json
          cd artifacts
          sha256sum meydan-android.apk meydan-windows-portable.zip meydan-demo-questions.json > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 || gh release create v0.1.0 --target "$GITHUB_SHA" --prerelease --title 'ميدان التحدي 0.1.0 — إصدار تجريبي' --notes-file docs/release-notes.md
          gh release upload v0.1.0 artifacts/meydan-android.apk artifacts/meydan-windows-portable.zip artifacts/meydan-demo-questions.json artifacts/SHA256SUMS.txt --clobber
